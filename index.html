<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>𝗥𝗜𝗗𝗢𝗬 𝗭𝗥™𝗟𝗘𝗔𝗗𝗘𝗥</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1d1438 0%, #0b0914 70%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: rgba(20, 17, 36, 0.9);
    border: 1px solid rgba(255, 215, 0, 0.28);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65), 0 0 24px rgba(255, 200, 0, 0.12);
    backdrop-filter: blur(12px);
  }

  .brand-header {
    text-align: center;
    margin-bottom: 20px;
  }

  .crown-logo {
    width: 68px;
    height: 68px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.22), rgba(138, 43, 226, 0.22));
    border: 2px solid #ffd700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 18px rgba(255, 215, 0, 0.35);
  }

  .crown-logo svg {
    width: 36px;
    height: 36px;
    fill: #ffd700;
    filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));
  }

  .brand-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
  }

  .sub-text {
    font-size: 12px;
    color: #b8b2d8;
    margin-top: 4px;
  }

  .form-group {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 12px;
    color: #d6d1f0;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(11, 9, 20, 0.85);
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: #ffd700;
  }

  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-gold {
    background: linear-gradient(90deg, #ffb700, #ffd700);
    color: #141022;
    margin-top: 6px;
  }

  .btn-register {
    display: block;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(90deg, #6c3bff, #9d4edd);
    color: #ffffff;
    margin-top: 12px;
  }

  .error-msg {
    color: #ff6b81;
    font-size: 12px;
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
  }

  #dashboard {
    display: none;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 12px;
    margin-bottom: 14px;
  }

  .dot-live {
    color: #2ed573;
    font-weight: 700;
  }

  .signal-box {
    text-align: center;
    background: rgba(11, 9, 20, 0.85);
    border: 1px solid rgba(255, 215, 0, 0.25);
    border-radius: 14px;
    padding: 18px 12px;
    margin-bottom: 14px;
  }

  .period-label {
    font-size: 12px;
    color: #a9a3c7;
    margin-bottom: 6px;
  }

  .signal-value {
    font-size: 28px;
    font-weight: 900;
    color: #ffd700;
    letter-spacing: 1px;
    margin: 6px 0;
  }

  .confidence-label {
    font-size: 12px;
    color: #7bed9f;
  }

  .btn-logout {
    background: rgba(255, 71, 87, 0.16);
    border: 1px solid rgba(255, 71, 87, 0.45);
    color: #ff6b81;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Login Section -->
  <div id="loginSection">
    <div class="brand-header">
      <div class="crown-logo" aria-label="Crown Logo">
        <svg viewBox="0 0 24 24">
          <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
        </svg>
      </div>
      <div class="brand-name">𝗥𝗜𝗗𝗢𝗬 𝗭𝗥™𝗟𝗘𝗔𝗗𝗘𝗥</div>
      <div class="sub-text">Access Panel • Crown Edition</div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">User / Leader Name</label>
        <input type="text" id="username" placeholder="Enter name" value="𝗥𝗜𝗗𝗢𝗬 𝗭𝗥™𝗟𝗘𝗔𝗗𝗘𝗥" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-gold">LOGIN</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <a href="https://dkwin.pro/#/register?invitationCode=814321956043" target="_blank" rel="noopener noreferrer" class="btn btn-register">
      REGISTER ACCOUNT
    </a>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboard">
    <div class="brand-header">
      <div class="crown-logo" aria-label="Crown Logo">
        <svg viewBox="0 0 24 24">
          <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
        </svg>
      </div>
      <div class="brand-name">𝗥𝗜𝗗𝗢𝗬 𝗭𝗥™𝗟𝗘𝗔𝗗𝗘𝗥</div>
      <div class="sub-text">Active Session</div>
    </div>

    <div class="status-bar">
      <span>Server: <strong>DKWIN PRO</strong></span>
      <span class="dot-live">● ONLINE</span>
    </div>

    <div class="signal-box">
      <div class="period-label" id="periodText">Period: --</div>
      <div class="signal-value" id="signalText">READY</div>
      <div class="confidence-label" id="confText">Accuracy: --%</div>
    </div>

    <button type="button" class="btn btn-gold" id="genSignalBtn">GET NEXT SIGNAL</button>
    <a href="https://dkwin.pro/#/register?invitationCode=814321956043" target="_blank" rel="noopener noreferrer" class="btn btn-register">
      OPEN PLATFORM LINK
    </a>
    <button type="button" class="btn btn-logout" id="logoutBtn">LOGOUT</button>
  </div>
</div>

<script>
  const CORRECT_PASS = "Ridoy@00";

  const loginSection = document.getElementById("loginSection");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const passwordInput = document.getElementById("password");
  const errorMsg = document.getElementById("errorMsg");
  const genSignalBtn = document.getElementById("genSignalBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const periodText = document.getElementById("periodText");
  const signalText = document.getElementById("signalText");
  const confText = document.getElementById("confText");

  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    const enteredPass = passwordInput.value.trim();

    if (enteredPass === CORRECT_PASS) {
      errorMsg.textContent = "";
      loginSection.style.display = "none";
      dashboard.style.display = "block";
      generateSignal();
    } else {
      errorMsg.textContent = "Wrong password! Please try again.";
    }
  });

  function generateSignal() {
    const now = new Date();
    const mins = now.getHours() * 60 + now.getMinutes();
    const periodCode = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}${1000 + mins}`;

    const outcomes = ["BIG", "SMALL", "RED", "GREEN"];
    const pick = outcomes[Math.floor(Math.random() * outcomes.length)];
    const accuracy = (88 + Math.random() * 9.5).toFixed(1);

    periodText.textContent = `Period: ${periodCode}`;
    signalText.textContent = pick;
    confText.textContent = `Confidence: ${accuracy}%`;
  }

  genSignalBtn.addEventListener("click", generateSignal);

  logoutBtn.addEventListener("click", function () {
    passwordInput.value = "";
    dashboard.style.display = "none";
    loginSection.style.display = "block";
  });
</script>
</body>
</html>
